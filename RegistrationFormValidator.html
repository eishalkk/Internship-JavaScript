<!DOCTYPE html>
<html>
<head>
    <title>Registration Form Validator</title>
    <script>
        function formValidator() {
            let name= document.getElementById("name");
            let age= document.getElementById("age");
            let city= document.getElementById("city");
            let email= document.getElementById("email");
            
            let valid = true;

            name.style.border = "";
            age.style.border = "";
            city.style.border = "";
            email.style.border = "";

            if (name.value==""){
                alert("Name can not be null!");
                name.style.border="3px solid red";
                valid=false;
            }
            if (age.value<18 || age.value>60 || age.value==""){
                alert("Age must be between 18 and 60");
                age.style.border="3px solid red";
                valid=false;
            }
            if (city.value==""){
                alert("City can not be null!");
                city.style.border="3px solid red";
                valid=false;
            }
            if (email.value==""){
                alert("Email can not be null!");
                email.style.border="3px solid red";
                valid=false;
            }

            if (valid==true){
                alert("Registration Successful\n\n" +
            "Name: " + name.value + "\n" +
            "Age: " + age.value + "\n" +
            "City: " + city.value + "\n" +
            "Email: " + email.value)
            }
        

        }
        
    </script>
</head>
<body>
    <h1 align="center">Registration Form Validator</h1>
    <h3 align="center">Enter the following details:</h3>
    <input type="text" id="name" placeholder="Enter your name...">
    <br><br>
    <input type="number" id="age" placeholder="Enter your age...">
    <br><br>
    <input type="text" id="city" placeholder="Enter city...">
    <br><br>
    <input type="email" id="email" placeholder="Enter email...">
    <br><br>
    <button onclick="formValidator()">Submit</button>
</body>
</html>
