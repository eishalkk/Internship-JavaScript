<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Calculator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
            let num1 = Number(prompt("Enter the first number: ",0));
            let num2 = Number(prompt("Enter the second number: ", 0));
            let oper = prompt("Enter an operator: [ + , - , * , / ]");
            let result;


            if (oper == "+"){
                result = num1+num2;
            }
            else if (oper == "-"){
                result = num1-num2;
            }
            else if (oper == "*"){
                result = num1*num2;
            }
            else if (oper == "/"){
                result = num1/num2;
            }
            else {
                result = "Invalid operator!";
            }
            alert("Result: "+ result);
        </script>
    </head>
    <body>
        <h1 align="center">Calculator!</h1>
    </body>
</html>
